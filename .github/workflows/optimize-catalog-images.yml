name: Process catalog image uploads

on:
  push:
    paths:
      - "upload_content/**/*.png"
      - "upload_content/**/*.jpg"
      - "upload_content/**/*.jpeg"
      - "upload_content/**/*.webp"
      - "upload_content/**/*.PNG"
      - "upload_content/**/*.JPG"
      - "upload_content/**/*.JPEG"
      - "upload_content/**/*.WEBP"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-catalog-image-uploads
  cancel-in-progress: false

jobs:
  process-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Convert, validate, move, and remove uploaded originals
        run: python scripts/process_upload_content.py

      - name: Commit and push processed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- upload_content catalog/catalog
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Process uploaded catalog images [skip ci]"
          git push origin HEAD:main
